# Wheels of the Python package (crates/python) for Linux, macOS and Windows, and a smoke test of each on its own system.
# Started by hand (Actions -> python -> Run workflow) or by a tag `python-v*`. It builds and tests. It does NOT publish:
# wheels are uploaded as artifacts of the run, putting them on PyPI is a separate decision and a separate step.
#
# Made from `maturin generate-ci github` (maturin 1.15) and cut down: one abi3 wheel covers every Python from 3.10, so no
# free-threaded and no per-version wheels, and no 32-bit or exotic targets. Linux aarch64 is built on an ARM runner, not by
# cross compilation: the cross toolchain of manylinux cannot build the assembly of `ring`. The Linux x86_64 wheel is also built and checked on the build machine of the
# project; the other systems are this file's job.
name: python

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: macos, runner: macos-15-intel, target: x86_64 }
          - { os: macos, runner: macos-latest, target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'off' }}
          sccache: true
      - name: Keep the wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: crates/python/dist

  # Install the wheel in a clean environment and run the tests of the package against the imitations of the brokers.
  # On every system the wheels are built for.
  smoke:
    name: smoke ${{ matrix.os }} ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-22.04, target: x86_64, python: "3.10" }
          - { os: linux, runner: ubuntu-22.04, target: x86_64, python: "3.14" }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64, python: "3.12" }
          - { os: macos, runner: macos-latest, target: aarch64, python: "3.13" }
          - { os: windows, runner: windows-latest, target: x64, python: "3.12" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist
      - name: Install the wheel and the test tools
        shell: bash
        run: |
          python -m venv venv
          if [ -d venv/Scripts ]; then PY=venv/Scripts/python; else PY=venv/bin/python; fi
          $PY -m pip install pytest pytest-asyncio
          $PY -m pip install --no-index --find-links dist brokapi
          $PY -c "import brokapi; print(brokapi.__version__)"
      # A user has the wheel and nothing else. Remove the sources of the other crates, so that a mock or anything else
      # that reads the source tree at run time fails here, not on the user's machine.
      - name: Remove the sources the wheel must not need
        shell: bash
        run: find crates -mindepth 1 -maxdepth 1 ! -name python -exec rm -rf {} +
      - name: Tests of the package
        shell: bash
        working-directory: crates/python
        run: |
          if [ -d ../../venv/Scripts ]; then PY=../../venv/Scripts/python; else PY=../../venv/bin/python; fi
          $PY -m pytest tests -q

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: crates/python/dist
