# The gateway and its program `brokapi` (crates/gateway) on Linux, macOS and Windows: build and tests.
# Started by a push to main and by hand (Actions -> gateway -> Run workflow).
#
# The tests start the program as a process (the service, the gateway processes, every command) against the imitations of
# the brokers in `crates/mocks`: no network, no money. Only what the gateway needs is built (`-p brokapi-gateway`), not the
# Python extension or the book, so a run takes minutes.
name: gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "proto/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gateway.yml"
      - "tools/proto-check"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gateway:
    name: gateway ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung test must end by itself, not hold the machine for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the program
        run: cargo build --locked -p brokapi-gateway
      # Every test binary runs even when one fails, so that one run shows all that is broken on a system.
      - name: Test the gateway, the service and the commands
        run: cargo test --locked -p brokapi-gateway --no-fail-fast

  # The .proto files with the tools of other languages: protoc and a Go client made by the command of the book.
  proto:
    name: proto with protoc and Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install protoc and the Go plugins
        run: |
          sudo apt-get update -q && sudo apt-get install -yq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compile the .proto files and build a Go client
        run: tools/proto-check
