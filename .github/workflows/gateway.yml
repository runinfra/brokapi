# The gateway, its program `brokapi` and WebSocket fault recovery on Linux, macOS and Windows.
# Started by a push to main and by hand (Actions -> gateway -> Run workflow).
#
# The tests start the program as a process (the service, the gateway processes, every command) against the imitations of
# the brokers in `crates/mocks`: no network, no money. Only what the gateway needs is built (`-p brokapi-gateway`), not the
# Python extension or the book, so a run takes minutes.
name: gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "proto/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go/**"
      - ".github/workflows/gateway.yml"
      - "tools/proto-check"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gateway:
    name: gateway ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung test must end by itself, not hold the machine for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the program
        run: cargo build --locked -p brokapi-gateway
      - name: Test the Go client
        working-directory: go
        run: go test ./...
      # Every test binary runs even when one fails, so that one run shows all that is broken on a system.
      - name: Test the gateway, the service and the commands
        run: cargo test --locked -p brokapi-gateway --no-fail-fast
      - name: Test WebSocket faults and subscription recovery
        if: ${{ !cancelled() }}
        run: cargo test --locked -p brokapi-bcs-protocol --test ws_wire -p brokapi-alor-protocol --test ws_faults --no-fail-fast

  # The .proto files with the tools of other languages: protoc makes the Go client of go/ the same as the one in the
  # repository, the module builds, and the Go bot of the book runs against a gateway on the imitation of BCS.
  proto:
    name: proto with protoc and Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and the Go plugins
        run: |
          sudo apt-get update -q && sudo apt-get install -yq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compile the .proto files, compare the Go client, build it
        run: tools/proto-check
      # BROKAPI_GO=1: without go the test would pass by saying so, here a missing go is a failure.
      - name: Run the Go bot against a gateway
        run: cargo test --locked -p brokapi-gateway --test go
        env:
          BROKAPI_GO: "1"
