<style>
/* Bar over the API reference (rustdoc and pdoc): the same mark, the same words, the same colors and the same theme as the book,
   and the way back to the book. The only place with this markup: docs/build.sh gives it to rustdoc (--html-before-content),
   docs/pydoc.py to pdoc (reference/frame.html.jinja2). The tokens are those of the book (theme/brokapi.css). */
:root { --bk-bar-h: 52px; }
.bk-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 3000; height: var(--bk-bar-h); box-sizing: border-box;
  display: flex; align-items: center; gap: 22px; padding: 0 16px;
  background: #ffffff; color: #0b1220; border-bottom: 1px solid #cdd3db;
  font: 400 15px/1 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-variant-ligatures: none;
}
:root[data-theme="dark"] .bk-bar { background: #0a0f1a; color: #e7ecf3; border-bottom-color: #243049; }
.bk-bar a, .bk-bar button { font: inherit; color: inherit; text-decoration: none; }
.bk-home { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 600; font-size: 21px; letter-spacing: -0.01em; }
.bk-mark { width: 30px; height: 30px; flex: 0 0 auto; }
.bk-mark path { fill: none; stroke: #1f3fe0; stroke-width: 2.4; stroke-linecap: round; }
:root[data-theme="dark"] .bk-mark path { stroke: #8fa8ff; }
.bk-mark circle { fill: #ff5b1f; }
:root[data-theme="dark"] .bk-mark circle { fill: #ff6a2b; }
.bk-docs { display: inline-flex; align-items: center; min-height: 44px; box-sizing: border-box; padding-top: 2px; border-bottom: 2px solid transparent; }
.bk-docs:hover { border-bottom-color: #1f3fe0; }
:root[data-theme="dark"] .bk-docs:hover { border-bottom-color: #8fa8ff; }
.bk-stage { display: inline-flex; align-items: center; gap: 8px; color: #566170; white-space: nowrap; font: 400 13px/1 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
:root[data-theme="dark"] .bk-stage { color: #93a0b4; }
.bk-dot { width: 8px; height: 8px; background: #ff5b1f; }
:root[data-theme="dark"] .bk-dot { background: #ff6a2b; }
.bk-nav { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.bk-nav a { display: inline-flex; align-items: center; min-height: 44px; box-sizing: border-box; padding-top: 2px; white-space: nowrap; border-bottom: 2px solid transparent; }
.bk-nav a:hover { border-bottom-color: #1f3fe0; }
:root[data-theme="dark"] .bk-nav a:hover { border-bottom-color: #8fa8ff; }
.bk-nav a[aria-current="page"] { border-bottom-color: #1f3fe0; font-weight: 600; }
:root[data-theme="dark"] .bk-nav a[aria-current="page"] { border-bottom-color: #8fa8ff; }
.bk-theme { appearance: none; background: transparent; border: 1px solid #cdd3db; border-radius: 3px; cursor: pointer; min-height: 32px; padding: 0 12px; white-space: nowrap; font-size: 13px; }
:root[data-theme="dark"] .bk-theme { border-color: #243049; }
.bk-theme:hover { background: #f2f4f7; }
:root[data-theme="dark"] .bk-theme:hover { background: #141c2e; }
.bk-bar :focus-visible { outline: 2px solid #1f3fe0; outline-offset: 2px; }
:root[data-theme="dark"] .bk-bar :focus-visible { outline-color: #8fa8ff; }
@media (max-width: 860px) { .bk-stage { display: none; } }
@media (max-width: 760px) {
  .bk-nav .bk-long { display: none; }
  .bk-bar { gap: 12px; padding: 0 10px; }
  .bk-nav { gap: 12px; }
}
@media (max-width: 480px) {
  .bk-docs { display: none; }
  .bk-nav a.bk-ref-other { display: none; }
  .bk-home { font-size: 19px; }
}
</style>
<div class="bk-bar" role="banner">
  <a class="bk-home" href="https://brokapi.ru/" aria-label="brokapi, brokapi.ru">
    <svg class="bk-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 8c9 0 10 8 17 8M3 16h17M3 24c9 0 10-8 17-8M20 16h4"/><circle cx="27" cy="16" r="3"/></svg>
    <span class="bk-word">brokapi</span>
  </a>
  <a class="bk-docs" href="/docs/">Документация</a>
  <span class="bk-stage"><span class="bk-dot"></span>закрытая альфа</span>
  <div class="bk-nav" role="navigation" aria-label="Книга и справочники">
    <a class="bk-ref-rust" href="/docs/api/brokapi/index.html"><span class="bk-long">Справочник&nbsp;</span>Rust</a>
    <a class="bk-ref-python" href="/docs/api/python/brokapi.html"><span class="bk-long">Справочник&nbsp;</span>Python</a>
    <button class="bk-theme" type="button" aria-label="Сменить тему"></button>
  </div>
</div>
<script>
(function () {
  var here = location.pathname.indexOf('/api/python/') >= 0 ? 'python' : 'rust';
  var cur = document.querySelector('.bk-ref-' + here);
  var other = document.querySelector('.bk-ref-' + (here === 'rust' ? 'python' : 'rust'));
  if (cur) cur.setAttribute('aria-current', 'page');
  if (other) other.classList.add('bk-ref-other');
  var root = document.documentElement, button = document.querySelector('.bk-theme');
  function label() { button.textContent = root.getAttribute('data-theme') === 'dark' ? 'Светлая' : 'Темная'; }
  label();
  button.addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') !== 'dark';
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    try {
      localStorage.setItem('mdbook-theme', dark ? 'coal' : 'light');
      localStorage.setItem('rustdoc-theme', dark ? 'dark' : 'light');
    } catch (e) {}
    label();
  });
})();
</script>
