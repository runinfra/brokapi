<style>
/* Thin bar over the API reference (rustdoc and pdoc): the same mark, the same words and the same theme as the book, and the
   way back to the book. The only place with this markup: docs/build.sh gives it to rustdoc (--html-before-content),
   docs/pydoc.py to pdoc (reference/frame.html.jinja2). */
:root { --bk-bar-h: 42px; }
.bk-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 3000; height: var(--bk-bar-h); box-sizing: border-box;
  display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: #f5f4ef; color: #121212; border-bottom: 1px solid #dcd9d0;
  font: 400 13px/1 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-variant-ligatures: none;
}
:root[data-theme="dark"] .bk-bar { background: #151513; color: #e7e5de; border-bottom-color: #2f2e2a; }
.bk-bar a, .bk-bar button { font: inherit; color: inherit; text-decoration: none; }
.bk-home { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
.bk-mark { width: 24px; height: 24px; flex: 0 0 auto; }
.bk-mark path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.bk-mark circle { fill: #ff5b1f; }
.bk-home:hover .bk-word { color: #c23c00; }
:root[data-theme="dark"] .bk-home:hover .bk-word { color: #ff7a45; }
.bk-docs { display: inline-flex; align-items: center; padding: 6px 10px; border: 1px solid #dcd9d0; border-radius: 999px; color: #5c5a55; }
:root[data-theme="dark"] .bk-docs { border-color: #2f2e2a; color: #9a978e; }
.bk-docs:hover { color: inherit; border-color: currentColor; }
.bk-stage { display: inline-flex; align-items: center; gap: 7px; color: #5c5a55; white-space: nowrap; }
:root[data-theme="dark"] .bk-stage { color: #9a978e; }
.bk-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5b1f; }
.bk-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.bk-nav a, .bk-theme { display: inline-flex; align-items: center; min-height: 32px; white-space: nowrap; padding: 0 10px; border-radius: 8px; color: #3a3935; }
:root[data-theme="dark"] .bk-nav a, :root[data-theme="dark"] .bk-theme { color: #b6b3a9; }
.bk-nav a:hover, .bk-theme:hover { background: #ebe9e1; color: #121212; }
:root[data-theme="dark"] .bk-nav a:hover, :root[data-theme="dark"] .bk-theme:hover { background: #26251f; color: #f5f4ef; }
.bk-nav a[aria-current="page"] { color: #121212; box-shadow: inset 0 -2px 0 #ff5b1f; border-radius: 0; }
:root[data-theme="dark"] .bk-nav a[aria-current="page"] { color: #f5f4ef; }
.bk-theme { appearance: none; background: transparent; border: 1px solid #dcd9d0; cursor: pointer; margin-left: 4px; }
:root[data-theme="dark"] .bk-theme { border-color: #2f2e2a; }
.bk-bar :focus-visible { outline: 2px solid #ff5b1f; outline-offset: 2px; }
@media (max-width: 760px) {
  .bk-stage, .bk-nav .bk-long { display: none; }
  .bk-bar { gap: 8px; padding: 0 8px; }
  .bk-nav a { padding: 0 7px; }
}
@media (max-width: 480px) {
  .bk-docs { display: none; }
  .bk-nav a.bk-ref-other { display: none; }
}
</style>
<div class="bk-bar" role="banner">
  <a class="bk-home" href="https://brokapi.ru/" aria-label="brokapi, brokapi.ru">
    <svg class="bk-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 8c9 0 10 8 17 8M3 16h17M3 24c9 0 10-8 17-8M20 16h4"/><circle cx="27" cy="16" r="3"/></svg>
    <span class="bk-word">brokapi</span>
  </a>
  <a class="bk-docs" href="/docs/">docs</a>
  <span class="bk-stage"><span class="bk-dot"></span>закрытая альфа</span>
  <div class="bk-nav" role="navigation" aria-label="Книга и справочники">
    <a class="bk-book" href="/docs/">В книгу</a>
    <a class="bk-ref-rust" href="/docs/api/brokapi/index.html"><span class="bk-long">Справочник&nbsp;</span>Rust</a>
    <a class="bk-ref-python" href="/docs/api/python/brokapi.html"><span class="bk-long">Справочник&nbsp;</span>Python</a>
    <button class="bk-theme" type="button" aria-label="Сменить тему"></button>
  </div>
</div>
<script>
(function () {
  var here = location.pathname.indexOf('/api/python/') >= 0 ? 'python' : 'rust';
  var cur = document.querySelector('.bk-ref-' + here);
  var other = document.querySelector('.bk-ref-' + (here === 'rust' ? 'python' : 'rust'));
  if (cur) cur.setAttribute('aria-current', 'page');
  if (other) other.classList.add('bk-ref-other');
  var root = document.documentElement, button = document.querySelector('.bk-theme');
  function label() { button.textContent = root.getAttribute('data-theme') === 'dark' ? 'Светлая' : 'Темная'; }
  label();
  button.addEventListener('click', function () {
    var dark = root.getAttribute('data-theme') !== 'dark';
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    try {
      localStorage.setItem('mdbook-theme', dark ? 'coal' : 'light');
      localStorage.setItem('rustdoc-theme', dark ? 'dark' : 'light');
    } catch (e) {}
    label();
  });
})();
</script>
