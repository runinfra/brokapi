<script>
/* Theme of the reference = theme of the book: the book keeps it in localStorage "mdbook-theme" ("light" or "coal"). This runs in
   the head, before the first paint, so the page does not flash in the wrong colors. rustdoc and pdoc both read data-theme. */
(function () {
  var t = null;
  try { t = localStorage.getItem('mdbook-theme'); } catch (e) {}
  if (t && t.charAt(0) === '"') t = t.slice(1, -1);
  var dark = t ? t === 'coal' : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  try {
    localStorage.setItem('rustdoc-theme', dark ? 'dark' : 'light');
    localStorage.setItem('rustdoc-use-system-theme', 'false');
  } catch (e) {}
})();
</script>
<script>
/* A block that scrolls sideways (a code block, a signature, a table) is reachable with the keyboard: the arrow keys scroll it
   once it has focus. Only blocks that do scroll get a tab stop; the rest are left out of the Tab order. */
(function () {
  function mark() {
    var els = document.querySelectorAll('.pdoc pre, .pdoc .attr, .pdoc table');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.scrollWidth > el.clientWidth + 1) el.setAttribute('tabindex', '0');
      else if (el.getAttribute('tabindex') === '0') el.removeAttribute('tabindex');
    }
  }
  document.addEventListener('DOMContentLoaded', mark);
  window.addEventListener('load', mark);
  window.addEventListener('resize', mark);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mark);
})();
</script>
