[book]
# Название библиотеки (в шапке слово brokapi написано в theme/index.hbs, оно не зависит от этого поля)
title = "brokapi"
language = "ru"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
# Вид brokapi, вариант "Спецификация" (как сайт brokapi.ru): белая страница и синий акцент, светлая "light" по умолчанию, темная "coal"
# как вариант. Файлы лежат в theme/
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["theme/brokapi.css"]
# Книга живет в подкаталоге https://brokapi.ru/docs/: от этого адреса строятся 404.html и поиск, остальные ссылки относительные
site-url = "/docs/"
# Схемы Mermaid рисуются в браузере из локальных файлов mermaid.min.js и mermaid-init.js
# (библиотека ставится командой `mdbook-mermaid install docs`, mermaid-init.js у нас свой, в цветах темы).
# mermaid.min.js (2,7 МБ) страница не подключает сама: theme/index.hbs кладет его адрес в #mermaid-lib, а mermaid-init.js
# подгружает файл только там, где есть схема. lang-tabs.js - выбор языка и вкладки Rust | Python, ui.js - таблицы-карточки,
# длинный код, кнопка копирования, search.js - окно поиска (Pagefind).
additional-js = ["mermaid.min.js", "mermaid-init.js", "lang-tabs.js", "ui.js", "search.js"]

# Разделы сайдбара сворачиваются: раскрыт только тот, где открытая страница, остальные - одна строка со стрелкой.
[output.html.fold]
enable = true
level = 0

# Встроенный поиск mdBook (elasticlunr) выключен: он режет все не-ASCII буквы, и по-русски ничего не находил. Поиск делает
# Pagefind: после mdbook build его индекс строит docs/build.sh (`pagefind --site docs/book`), окно поиска - docs/search.js.
[output.html.search]
enable = false

[output.html.playground]
runnable = false

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Снимает общий отступ с блоков кода: якорь внутри функции попадает в книгу с отступом, а такой код Python не запустится
# после копирования. Работает после `links`, который делает {{#include}} (docs/dedent_code.py).
[preprocessor.dedent-code]
command = "python3 dedent_code.py"
after = ["links"]

# Страницы readiness и live убраны из книги: их адреса ведут на "Перед боевым счетом".
# Страницы раздела Rust переехали в rust/ (21.10.2026). Старые адреса остаются рабочими: mdBook кладет на их место
# страницу с переадресацией. Переадресация и для markdown-копий агентов: docs/llms.py читает эту таблицу и пишет
# старый page.md с адресом нового. Три последние строки - не переезд: mdBook пишет ссылки на README.md как README.html,
# а страница лежит в index.html, и api-reference.md собирается уже после mdBook (docs/apidigest.py), поэтому ссылки на
# них идут через переадресацию.
[output.html.redirect]
"/quickstart.html" = "rust/quickstart.html"
"/howto-trading-bot.html" = "rust/howto-trading-bot.html"
"/howto-infrastructure.html" = "rust/howto-infrastructure.html"
"/howto-research.html" = "rust/howto-research.html"
"/lifecycle.html" = "rust/lifecycle.html"
"/recovery.html" = "rust/recovery.html"
"/accounts.html" = "rust/accounts.html"
"/stop-orders.html" = "rust/stop-orders.html"
"/raw.html" = "rust/raw.html"
"/mocks.html" = "rust/mocks.html"
"/mcp/index.html" = "../cli/index.html"
"/readiness.html" = "before-live.html"
"/live.html" = "before-live.html"
"/README.html" = "index.html"
"/brokers/README.html" = "index.html"
"/api-reference.html" = "api-reference.md"
"/python/api-reference.html" = "api-reference.md"
