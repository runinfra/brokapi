[book]
# Название библиотеки: оно же стоит в шапке справа от RUNINFRA (theme/index.hbs берет его отсюда)
title = "brokapi"
language = "ru"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
# Вид RunInfra: темная тема "navy" по умолчанию, светлая "light" с акцентом темнее. Файлы лежат в theme/
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/runinfra.css"]
# Схемы Mermaid рисуются в браузере из локальных файлов mermaid.min.js и mermaid-init.js
# (библиотека ставится командой `mdbook-mermaid install docs`, mermaid-init.js у нас свой, в цветах темы)
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.playground]
runnable = false

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
