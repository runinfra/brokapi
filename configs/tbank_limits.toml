GetAccruedInterests = ["global", "instruments"]
GetFuturesMargin = ["global", "instruments"]
GetDividends = ["global", "instruments"]
GetAssetBy = ["global", "instruments"]
GetFavorites = ["global", "instruments"]
EditFavorites = ["global", "instruments"]
CreateFavoriteGroup = ["global", "instruments"]
DeleteFavoriteGroup = ["global", "instruments"]
GetFavoriteGroups = ["global", "instruments"]
GetCountries = ["global", "instruments"]
GetBrands = ["global", "instruments"]
GetBrandBy = ["global", "instruments"]
GetAssetFundamentals = ["global", "instruments"]
GetAssetReports = ["global", "instruments"]
GetConsensusForecasts = ["global", "instruments"]
GetForecastBy = ["global", "instruments"]
GetRiskRates = ["global", "instruments"]
GetInsiderDeals = ["global", "instruments"]
StructuredNoteBy = ["global", "instruments"]
StructuredNotes = ["global", "instruments"]
# Quotes service unary (600/min)
GetLastPrices = ["global", "market_data"]
GetTradingStatuses = ["global", "market_data"]
GetClosePrices = ["global", "market_data"]
GetTechAnalysis = ["global", "market_data"]
GetMarketValues = ["global", "market_data"]
# Operations service (200/min); reports 5/min
GetOperations = ["global", "operations"]
GetWithdrawLimits = ["global", "operations"]
GetBrokerReport = ["global", "operations_reports"]
GetDividendsForeignIssuer = ["global", "operations_reports"]
# Orders service (100/min); PostOrderAsync has its own row
PostOrderAsync = ["global", "order_post_async"]
GetMaxLots = ["global", "orders_service"]
GetOrderPrice = ["global", "orders_service"]
# Stop orders service (50/min), GetStopOrders 60/min
