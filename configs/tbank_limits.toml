[tbank.conns]
# Stream connections per user: market data 32; orders 16 per stream type; operations 11 per stream type
# (max_conns below is the tightest of them).
# 300 simultaneous subscriptions (candles + order books + trades together) inside one market-data stream.
# The unary calls share one HTTP/2 channel, so there are no dedicated command connections.
max_conns = 11
max_subs_per_conn = 300
supports_multiplex = true
dedicated_command_conns = 0
