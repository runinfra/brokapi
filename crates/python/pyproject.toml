[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "brokapi"
description = "One interface to the APIs of Russian brokers and crypto exchanges for Python (now BCS, T-Bank, Finam, ALOR, Bybit): a thin layer over the Rust core of brokapi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
keywords = ["trading", "broker", "algotrading", "finance", "api", "asyncio", "moex", "russia", "t-bank", "tinkoff", "finam", "alor", "bcs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://brokapi.ru/docs/python/"
Homepage = "https://brokapi.ru/"
Repository = "https://github.com/runinfra/brokapi"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-timeout>=2.3"]

[tool.maturin]
python-source = "python"
module-name = "brokapi._native"
features = ["extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
# A test that waits for something that does not come must fail by itself, with the place where it stands, and not hold the
# machine (a whole test takes well under a second, the limit is for a hang). `pytest-timeout` ends the test, or on a system
# without signals (Windows) the whole run, and prints the stack of every thread.
timeout = 60
# Without the plugin the stacks are at least printed.
faulthandler_timeout = 120
