[package]
name = "brokapi-python"
description = "Python bindings of brokapi: the native module behind `pip install brokapi` (PyO3)."
version = "0.1.0-alpha.8"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["The brokapi Authors"]
homepage = "https://brokapi.ru"
repository = "https://github.com/runinfra/brokapi"
documentation = "https://brokapi.ru/docs/python/"
rust-version = "1.88"
readme = "README.md"
keywords = ["trading", "broker", "finance", "algotrading", "moex"]
categories = ["api-bindings", "finance"]
publish = false

# A workspace of its own: the extension needs a Python interpreter to build, and the Rust workspace of the
# library (cargo test --workspace, clippy, rustdoc) must build on a machine without one.
# `tools/check` builds it with maturin; it shares the target directory of the main workspace.
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]
# The module is tested from Python (pytest), not by cargo: a test binary of a PyO3 extension cannot link.
test = false
doctest = false

[features]
default = ["testing"]
# Python `brokapi.testing`: imitations of the brokers in the wheel, so that a user can test a bot without a broker.
testing = ["dep:brokapi-mocks", "dep:tempfile"]
# Set by maturin (pyproject.toml): the module is loaded by Python, so it must not link libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
brokapi = { path = "../..", features = ["bcs", "tbank", "finam", "alor", "bybit"] }
brokapi-client = { path = "../client" }
# Only the library of the gateway, the client of a bot: no clap, no toml, no program `brokapi` (feature `cli`).
brokapi-gateway = { path = "../gateway", default-features = false }
brokapi-mocks = { path = "../mocks", optional = true }
tempfile = { version = "3", optional = true }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
