[package]
name = "brokapi-mocks"
description = "In-process broker imitations (BCS, T-Bank, Finam) for tests and examples. Not part of the library's public promise."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
brokapi-bcs-protocol.workspace = true
brokapi-conformance.workspace = true
brokapi-core.workspace = true
chrono.workspace = true
brokapi-finam-protocol.workspace = true
futures-util.workspace = true
http = "1"
prost-types = "0.14"
rust_decimal.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
brokapi-tbank-protocol = { workspace = true, features = ["server"] }
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util.workspace = true
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "server"] }
