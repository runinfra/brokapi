[package]
name = "brokapi-mocks"
description = "In-process imitations of the brokers of brokapi (BCS, T-Bank, Finam, ALOR, Bybit) for your own tests: servers on 127.0.0.1 that speak the protocol of each broker. Their API may change between versions."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
brokapi-bcs-protocol.workspace = true
brokapi-bybit-protocol.workspace = true
# A normal dependency of a published crate needs a version. The others take brokapi-conformance by path, as a
# dev-dependency that publishing drops. Moves with the version of the workspace (tests/version_sync.rs).
brokapi-conformance = { path = "../conformance", version = "0.1.0-alpha.10" }
brokapi-core.workspace = true
chrono.workspace = true
brokapi-finam-protocol.workspace = true
futures-util.workspace = true
http = "1"
prost-types = "0.14"
rust_decimal.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
brokapi-tbank-protocol = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["full", "test-util"] }
brokapi-runtime.workspace = true
reqwest.workspace = true
uuid.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util.workspace = true
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "server"] }
