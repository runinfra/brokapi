[package]
name = "brokapi-bybit"
description = "Bybit MarketDataConnector and UserDataConnector (API V5, USDT perpetuals and futures)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brokapi-bybit-protocol.workspace = true
brokapi-core.workspace = true
brokapi-runtime.workspace = true
brokapi-sansio.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v5"] }
async-trait.workspace = true
kanal.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
brokapi-conformance.workspace = true
brokapi-mocks.workspace = true
futures-util.workspace = true
dotenvy.workspace = true
proptest.workspace = true
uuid.workspace = true

[lib]
name = "brokapi_bybit"
path = "src/lib.rs"

[features]
default = []
# Level-3 integration tests against the live Bybit API (never run in CI).
integration-live = []
