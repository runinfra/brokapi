[package]
name = "brokapi-alor"
description = "ALOR Broker MarketDataConnector and UserDataConnector"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brokapi-alor-protocol.workspace = true
brokapi-core.workspace = true
brokapi-runtime.workspace = true
brokapi-sansio.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v5"] }
async-trait.workspace = true
kanal.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
brokapi-conformance.workspace = true
brokapi-mocks.workspace = true
futures-util.workspace = true
proptest.workspace = true
tokio-test = "0.4"
uuid.workspace = true

[lib]
name = "brokapi_alor"
path = "src/lib.rs"

[features]
default = []
# Level-3 integration tests against the live ALOR API (never run in CI).
integration-live = []
