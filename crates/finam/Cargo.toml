[package]
name = "brokapi-finam"
description = "Finam MarketDataConnector and UserDataConnector (Trade API over gRPC)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait.workspace = true
brokapi-core.workspace = true
brokapi-runtime.workspace = true
brokapi-sansio.workspace = true
chrono.workspace = true
brokapi-finam-protocol.workspace = true
futures-util.workspace = true
prost-types = "0.14"
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
proptest.workspace = true
brokapi-conformance.workspace = true
brokapi-mocks.workspace = true
dotenvy.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[features]
default = []
# Level-3 tests against the live Finam API (secret and account from .env, never run in CI).
integration-live = []

[lib]
name = "brokapi_finam"
path = "src/lib.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "sansio_tests"
path = "tests/sansio_tests.rs"

[[test]]
name = "connector_tests"
path = "tests/connector_tests.rs"

[[test]]
name = "stop_orders"
path = "tests/stop_orders.rs"

[[test]]
name = "raw_access"
path = "tests/raw_access.rs"

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["integration-live"]
